name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Limine 12.x release package (prebuilt data files plus the limine.c tool source).
  # Pinned by tag and SHA-256 so a moved or replaced asset fails the job.
  LIMINE_VERSION: v12.9.6
  LIMINE_BINARY_SHA256: b38aabb042b0c0f9f562b7741be3c1204838d7bbacfa78bb411c674bd5b984ee

jobs:
  build:
    name: Lint, test and build the kernel
    # Pinned to 24.04: as of 2026-11-11 the ubuntu-latest (26.04) image cannot
    # resolve the Ubuntu archive mirrors, so apt-get update fails. Revisit later.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: false

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install LLD
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends lld

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint the host crates
        run: cargo clippy -p wuxia-core -p wuxia-xtask --all-targets -- -D warnings

      - name: Host tests (core)
        run: cargo test -p wuxia-core

      - name: Host tests (xtask)
        run: cargo test -p wuxia-xtask

      - name: Build the bare-metal kernel
        run: cargo run -p wuxia-xtask -- build-kernel
        env:
          WUXIA_LLD: ld.lld

      - name: Audit the kernel image for W^X
        run: cargo run -p wuxia-xtask -- elf-info

  qemu-boot:
    name: Boot the ISO under QEMU
    # Pinned to 24.04: as of 2026-11-11 the ubuntu-latest (26.04) image cannot
    # resolve the Ubuntu archive mirrors, so apt-get update fails. Revisit later.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install QEMU, xorriso and LLD
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends qemu-system-x86 xorriso lld

      - name: Fetch and build Limine
        run: |
          mkdir -p "$RUNNER_TEMP/limine"
          curl --proto '=https' --tlsv1.2 -fsSL \
            -o "$RUNNER_TEMP/limine/limine-binary.tar.gz" \
            "https://github.com/Limine-Bootloader/Limine/releases/download/${LIMINE_VERSION}/limine-binary.tar.gz"
          echo "${LIMINE_BINARY_SHA256}  $RUNNER_TEMP/limine/limine-binary.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/limine/limine-binary.tar.gz" -C "$RUNNER_TEMP/limine"
          make -C "$RUNNER_TEMP/limine/limine-binary"
          echo "$RUNNER_TEMP/limine/limine-binary" >> "$GITHUB_PATH"

      - name: Build the ISO and boot it headless
        run: cargo run -p wuxia-xtask -- qemu-test
        env:
          WUXIA_LLD: ld.lld
          WUXIA_LIMINE_DIR: ${{ runner.temp }}/limine/limine-binary
